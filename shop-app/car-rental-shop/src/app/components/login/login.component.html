<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-gradient">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-xl-4 col-lg-5 col-md-6">
          <!-- Login Card -->
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-white py-4 border-0 text-center">
              <div class="mb-3">
                <fa-icon [icon]="faCar" class="display-1 text-primary"></fa-icon>
              </div>
              <h1 class="h2 fw-bold">Welcome Back</h1>
              <p class="text-muted mb-0">Sign in to your account</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
              <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                <!-- Username/Email -->
                <div class="mb-4">
                  <label class="form-label fw-bold">
                    <fa-icon [icon]="faUser" class="me-2"></fa-icon>
                    Username or Email
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                      <fa-icon [icon]="faEnvelope"></fa-icon>
                    </span>
                    <input type="text" 
                           class="form-control border-start-0" 
                           formControlName="username"
                           placeholder="Enter your username or email"
                           [class.is-invalid]="isFieldInvalid('username')"
                           autocomplete="username">
                  </div>
                  <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('username')">
                    Username is required
                  </div>
                </div>
  
                <!-- Password -->
                <div class="mb-4">
                  <label class="form-label fw-bold">
                    <fa-icon [icon]="faLock" class="me-2"></fa-icon>
                    Password
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                      <fa-icon [icon]="faLock"></fa-icon>
                    </span>
                    <input [type]="showPassword ? 'text' : 'password'" 
                           class="form-control border-start-0 border-end-0" 
                           formControlName="password"
                           placeholder="Enter your password"
                           [class.is-invalid]="isFieldInvalid('password')"
                           autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0" 
                            type="button"
                            (click)="togglePasswordVisibility()">
                      <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
                    </button>
                  </div>
                  <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('password')">
                    Password is required (min 4 characters)
                  </div>
                </div>
  
                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" 
                           type="checkbox" 
                           formControlName="rememberMe"
                           id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">
                      Remember me
                    </label>
                  </div>
                  <a href="#" class="text-primary text-decoration-none" 
                     (click)="navigateToForgotPassword(); $event.preventDefault()">
                    Forgot password?
                  </a>
                </div>
  
                <!-- Submit Button -->
                <button type="submit" 
                        class="btn btn-primary btn-lg w-100 py-3"
                        [disabled]="isLoading || loginForm.invalid">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                  <fa-icon [icon]="faSignInAlt" class="me-2"></fa-icon>
                  Sign In
                </button>
              </form>
  
              <!-- Divider -->
              <div class="text-center my-4">
                <span class="text-muted">Or continue with</span>
              </div>
  
              <!-- Social Login (Optional) -->
              <div class="row g-2 mb-4">
                <div class="col">
                  <button type="button" class="btn btn-outline-dark w-100" disabled>
                    <i class="fab fa-google me-2"></i> Google
                  </button>
                </div>
                <div class="col">
                  <button type="button" class="btn btn-outline-primary w-100" disabled>
                    <i class="fab fa-facebook-f me-2"></i> Facebook
                  </button>
                </div>
              </div>
  
              <!-- Sign Up Link -->
              <div class="text-center">
                <p class="text-muted mb-0">
                  Don't have an account?
                  <a href="#" class="text-primary fw-bold text-decoration-none ms-1"
                     (click)="navigateToRegister(); $event.preventDefault()">
                    Sign up
                  </a>
                </p>
              </div>
  
              <!-- Test Accounts (Development Only) -->
              <div class="mt-4 pt-4 border-top" *ngIf="testAccounts.length > 0">
                <h6 class="text-muted mb-3">Test Accounts:</h6>
                <div class="row g-2">
                  <div class="col-12" *ngFor="let account of testAccounts">
                    <button type="button" 
                            class="btn btn-sm btn-outline-info w-100 text-start"
                            (click)="fillTestAccount(account)">
                      <div class="d-flex justify-content-between align-items-center">
                        <span>
                          <strong>{{ account.username }}</strong> / {{ account.password }}
                        </span>
                        <small class="badge bg-light text-dark">{{ account.role }}</small>
                      </div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
  
            <!-- Footer -->
            <div class="card-footer bg-light py-3 text-center border-0">
              <small class="text-muted">
                By signing in, you agree to our 
                <a href="#" class="text-primary">Terms & Conditions</a> and 
                <a href="#" class="text-primary">Privacy Policy</a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
