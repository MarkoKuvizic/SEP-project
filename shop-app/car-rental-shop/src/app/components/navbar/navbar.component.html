<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container">
      <a class="navbar-brand" routerLink="/">
        <fa-icon [icon]="faCar" class="me-2"></fa-icon>
        <span class="fw-bold">DriveRent</span>
      </a>
  
      <button class="navbar-toggler" type="button" 
              (click)="isMenuCollapsed = !isMenuCollapsed"
              [attr.aria-expanded]="!isMenuCollapsed">
        <fa-icon [icon]="faBars"></fa-icon>
      </button>
  
      <div class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/cars" routerLinkActive="active">Cars</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/categories">Categories</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/deals">Deals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/locations">Locations</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/faq">FAQ</a>
          </li>
        </ul>
  
        <div class="d-flex align-items-center">
          <div class="input-group me-3 d-none d-lg-flex">
            <span class="input-group-text bg-light border-0">
              <fa-icon [icon]="faSearch"></fa-icon>
            </span>
            <input type="text" class="form-control border-0 bg-light" 
                   placeholder="Search cars...">
          </div>
  
          <button class="btn btn-outline-primary position-relative me-3" 
                  (click)="navigateToCart()">
            <fa-icon [icon]="faShoppingCart"></fa-icon>
            <span *ngIf="cartItemCount > 0" 
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ cartItemCount }}
            </span>
          </button>
  
          <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" 
                    id="userDropdown" data-bs-toggle="dropdown">
              <fa-icon [icon]="faUser" class="me-2"></fa-icon>
              Account
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" routerLink="/profile">Profile</a></li>
              <li><a class="dropdown-item" routerLink="/bookings">My Bookings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
